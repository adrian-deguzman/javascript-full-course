<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Review</title>
    <style>
      .pink-button {
        background-color: lightpink;
        color: black;
        border: 1px solid black;
        border-radius: 3px;
        transition: background-color 0.3s;
      }

      .blue-button {
        background-color: lightblue;
      }

      button:hover {
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
    <button title="This is a tooltip." class="pink-button">hello</button>

    <p>paragraph of text <button class="blue-button">hehe</button></p>
  </body>
</html>
