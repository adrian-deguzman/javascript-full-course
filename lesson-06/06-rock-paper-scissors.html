<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="checkWinner('rock')">Rock</button>
    <button onclick="checkWinner('paper')">Paper</button>
    <button onclick="checkWinner('scissors')">Scissors</button>

    <script>
      let winCount = 0;
      let lossCount = 0;
      let drawCount = 0;
      let computerMove = "";
      let message = "";
      const winMessage = "YOU WIN";
      const lossMessage = "You lose";
      const tieMessage = "It's a tie";

      function generateCompMove() {
        const randomNumber = Math.random();

        if (randomNumber < 1 / 3) {
          return "rock";
        } else if (randomNumber < 2 / 3) {
          return "paper";
        } else {
          return "scissors";
        }
      }

      function checkWinner(userMove) {
        computerMove = generateCompMove();

        if (userMove === "rock") {
          if (computerMove === "paper") {
            lossCount += 1;
            message = lossMessage;
          } else if (computerMove === "scissors") {
            winCount += 1;
            message = winMessage;
          } else {
            drawCount += 1;
            message = tieMessage;
          }
        } else if (userMove === "paper") {
          if (computerMove === "scissors") {
            lossCount += 1;
            message = lossMessage;
          } else if (computerMove === "rock") {
            winCount += 1;
            message = winMessage;
          } else {
            drawCount += 1;
            message = tieMessage;
          }
        } else if (userMove === "scissors") {
          if (computerMove === "rock") {
            lossCount += 1;
            message = lossMessage;
          } else if (computerMove === "paper") {
            winCount += 1;
            message = winMessage;
          } else {
            drawCount += 1;
            message = tieMessage;
          }
        }

        // console.log(randomNumber.toFixed(2));
        console.log(`User: ${userMove}`);
        console.log(`Comp: ${computerMove}`);
        console.log(message);
        console.log(`Win: ${winCount}, Loss: ${lossCount}, Draw: ${drawCount}`);
        console.log("");
      }
    </script>
  </body>
</html>
