<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Quantity - Adrian</title>
  </head>
  <body>
    <p>Cart Quantity - Adrian</p>

    <button onclick="showQuantity()">Show Quantity</button>
    <button onclick="addToCart(1)">Add to Card</button>
    <button onclick="addToCart(2)">+2</button>
    <button onclick="addToCart(3)">+3</button>
    <button onclick="resetCart()">Reset Cart</button>

    <script>
      let cartQuantity = 0;

      function showQuantity() {
        console.log(`Cart quantity: ${cartQuantity}`);
      }

      function addToCart(num) {
        cartQuantity += num;
        showQuantity();
      }

      function resetCart() {
        cartQuantity = 0;
        showQuantity();
      }
    </script>
  </body>
</html>
